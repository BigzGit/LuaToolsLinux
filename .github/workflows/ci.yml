name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Python syntax check
        run: python -m compileall -q backend

      - name: Python security/regression tests
        run: python -m unittest discover -s tests -v

      - name: Bash syntax check
        run: |
          for script in install.sh update.sh install_with_slssteam.sh Install-Millenium.sh; do
            bash -n "$script"
          done

      - name: JavaScript syntax check
        run: node --check public/luatools.js

      - name: Frontend security tests
        run: node tests/test_ui_security.js

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan for committed secrets
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          patterns = {
              "morrenus key": re.compile(r"smm_[0-9a-f]{16,}"),
              "github token": re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              "github pat": re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              "aws key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "slack token": re.compile(r"xox[baprs]-[A-Za-z0-9-]{10,}"),
              "google api key": re.compile(r"AIza[0-9A-Za-z_\-]{35}"),
              "private key": re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "stripe key": re.compile(r"sk_live_[A-Za-z0-9]{20,}"),
          }
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []
          for name in files:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for label, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      findings.append(f"{name}: {label}: {match.group(0)[:8]}…")
          if findings:
              raise SystemExit("Potential secrets found:\n" + "\n".join(findings))
          print("No obvious committed secrets detected.")
          PY

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
